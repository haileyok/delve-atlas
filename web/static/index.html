<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delve Atlas</title>
  <!-- {{origin}}, {{description}} and {{ogv}} are filled in by the server for each request (internal/server/meta.go). -->
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0b0d12">
  <link rel="canonical" href="{{origin}}/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Delve Atlas">
  <meta property="og:title" content="Delve Atlas: what Delve is talking about">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{origin}}/">
  <meta property="og:image" content="{{origin}}/og.jpg?v={{ogv}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A map of Delve: every post a dot, grouped by subject into named regions, with the totals for the last week.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Delve Atlas: what Delve is talking about">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{origin}}/og.jpg?v={{ogv}}">
  <meta name="twitter:image:alt" content="A map of Delve: every post a dot, grouped by subject into named regions, with the totals for the last week.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="text/markdown" href="/AGENTS.md" title="Guide for agents: the read-only JSON API">
  <link rel="describedby" type="application/json" href="/api/v1/openapi.json" title="OpenAPI description of the API">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="header">
    <button id="sidebar-toggle" class="icon" title="Toggle sidebar">☰</button>
    <div class="brand">Delve <span>Atlas</span></div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search posts and accounts…  ( / )" autocomplete="off" spellcheck="false">
    </div>
    <label class="color-by">Colour
      <select id="color-mode">
        <option value="topic">by topic</option>
        <option value="age">by age</option>
        <option value="engagement">by engagement</option>
      </select>
    </label>
    <div id="meta" class="meta"></div>
    <a class="header-link" href="/AGENTS.md" title="A read-only JSON API for agents, with a guide">For agents</a>
  </header>

  <aside id="sidebar">
    <div class="tabs">
      <button class="tab active" data-pane="map-pane">Map</button>
      <button class="tab" data-pane="activity">Activity</button>
    </div>
    <div id="map-pane" class="tabpane active"><div id="outline"></div></div>
    <div id="activity" class="tabpane"></div>
  </aside>

  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="status">Loading…</div>
    <div id="tooltip"></div>
    <div class="zoom-controls">
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="home" title="Reset view">⌂</button>
    </div>
    <div id="timeline-wrap">
      <button id="play" title="Replay the week">▶</button>
      <div id="range-info"></div>
      <div id="timeline"></div>
    </div>
    <aside id="drawer"></aside>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
